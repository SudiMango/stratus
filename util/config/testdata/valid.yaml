proxy:
  read_timeout: "30s"
  read_header_timeout: "500ms"
  write_timeout: "1m30s"
  idle_timeout: "2m"
  max_header_bytes: 1048576
  http:
    enabled: true
    port: 8080
    redirect_to_https: false
  https:
    enabled: false
    port: 0
    cert: ""
    key: ""

routes:
  - host: "app.example.com"
    destination: "localhost"
    port: 3000
    path: "/"
    tls: false
