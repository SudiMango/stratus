proxy:
  read_timeout: "30s"
  read_header_timeout: "5s"
  write_timeout: "30s"
  idle_timeout: "1m"
  max_header_bytes: 1048576

  http:
    enabled: true
    port: 8880
    redirect_to_https: true

  https:
    enabled: true
    port: 8443

  certificates:
    - host: "app.example.com"
      cert: "cert.pem"
      key: "key.pem"

    - host: "api.example.com"
      cert: "cert.pem"
      key: "key.pem"

routes:
  - host: "app.example.com"
    destination: "localhost"
    port: 3000
    path: "/"
    tls: false

  - host: "app.example.com"
    destination: "localhost"
    port: 4000
    path: "/test/{rest...}"
    tls: false

  - host: "api.example.com"
    destination: "localhost"
    port: 5000
    path: "/"
    tls: false